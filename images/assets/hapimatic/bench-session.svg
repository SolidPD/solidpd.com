<!-- Hardware Bench figure, version I of ten: "Rack and stand" (issue #4771, Sub L of #4539). On the page: the Hardware Bench add-on page inlines this version as its hero figure (fig. 1 — a session at
     the bench).
     Source: BENCH_FIGS in build-addon-mocks-v9.mjs (mockup branch hapi-website-launch-design-work @ 10e1c67d1;
     the review sheet bench-figures.html), converted to #4769's motion rules (docs/public-site/design/README.md
     "The motion rules"): every moving part is in an "anim" group with a "still" resting form beside it — the
     oscilloscope trace fully drawn, the board's LED lit, and each token at its path's destination — so the
     still frame is complete. Its styles are the .dg and .pcbg rules of site.css. No vendor named. -->
